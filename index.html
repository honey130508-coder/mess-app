<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIT-AP Mess Menu Dashboard | Premium Cafeteria Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS (xlsx) for in-browser Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Pre-parsed data script for zero-CORS offline execution -->
  <script src="src/data/defaultMenu.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #030712;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .glow-orange {
      box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.35);
    }
    .glow-emerald {
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.35);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const WEEKDAYS = [
      { full: 'Monday', short: 'Mon' },
      { full: 'Tuesday', short: 'Tue' },
      { full: 'Wednesday', short: 'Wed' },
      { full: 'Thursday', short: 'Thu' },
      { full: 'Friday', short: 'Fri' },
      { full: 'Saturday', short: 'Sat' },
      { full: 'Sunday', short: 'Sun' }
    ];

    const DAYS_ORDER = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const MEALS_CONFIG = [
      {
        id: 'Breakfast',
        label: 'Breakfast',
        time: '7:30 AM – 9:30 AM',
        icon: '🥞',
        color: 'from-amber-500 to-orange-500',
        activeGlow: 'glow-orange',
        tagBg: 'bg-amber-500/20 text-amber-300 border-amber-500/30'
      },
      {
        id: 'Lunch',
        label: 'Lunch',
        time: '12:00 PM – 2:30 PM',
        icon: '🍛',
        color: 'from-emerald-500 to-teal-500',
        activeGlow: 'glow-emerald',
        tagBg: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
      },
      {
        id: 'Snacks',
        label: 'Snacks',
        time: '4:30 PM – 5:45 PM',
        icon: '☕',
        color: 'from-purple-500 to-indigo-500',
        activeGlow: 'shadow-purple-500/20',
        tagBg: 'bg-purple-500/20 text-purple-300 border-purple-500/30'
      },
      {
        id: 'Dinner',
        label: 'Dinner',
        time: '7:30 PM – 9:30 PM',
        icon: '🍲',
        color: 'from-blue-500 to-cyan-500',
        activeGlow: 'shadow-blue-500/20',
        tagBg: 'bg-blue-500/20 text-blue-300 border-blue-500/30'
      }
    ];

    // Dietary Indicator Badge
    function DietBadge({ diet }) {
      if (diet === 'non-veg') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30">
            <span className="w-2 h-2 rounded-sm bg-rose-500"></span>
            Non-Veg
          </span>
        );
      }
      if (diet === 'egg') {
        return (
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">
            <span className="w-2 h-2 rounded-full bg-amber-400"></span>
            Egg
          </span>
        );
      }
      if (diet === 'beverage') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/30">
            <span>☕</span>
            Beverage
          </span>
        );
      }
      if (diet === 'sweet') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/30">
            <span>🍬</span>
            Sweet
          </span>
        );
      }
      if (diet === 'soup') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-teal-500/10 text-teal-400 border border-teal-500/30">
            <span>🍲</span>
            Soup
          </span>
        );
      }
      return (
        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
          <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
          Veg
        </span>
      );
    }

    // Rotation Badge
    function RotationBadge({ rotation }) {
      if (rotation === 'week1_3') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">
            <span>🔄</span> Week 1 & 3
          </span>
        );
      }
      if (rotation === 'week2_4') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-violet-500/20 text-violet-300 border border-violet-500/40">
            <span>🔄</span> Week 2 & 4
          </span>
        );
      }
      if (rotation === 'alt_weeks') {
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-sky-500/20 text-sky-300 border border-sky-500/40">
            <span>🔄</span> Alt Weeks
          </span>
        );
      }
      return null;
    }

    // Menu Card Component
    function MenuCard({ mealName, mealData, searchQuery, selectedRotation, selectedDiet }) {
      if (!mealData || !mealData.items) {
        return (
          <div className="bg-slate-900/60 rounded-2xl p-6 border border-slate-800 text-center text-slate-500">
            No menu items available for {mealName}.
          </div>
        );
      }

      const filteredItems = mealData.items.filter((item) => {
        if (searchQuery) {
          if (!item.text.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        }
        if (selectedRotation !== 'all' && item.rotation !== 'all') {
          if (item.rotation !== selectedRotation) return false;
        }
        if (selectedDiet !== 'all') {
          if (selectedDiet === 'veg' && item.diet !== 'veg') return false;
          if (selectedDiet === 'non-veg' && item.diet !== 'non-veg') return false;
          if (selectedDiet === 'egg' && item.diet !== 'egg') return false;
          if (selectedDiet === 'beverage' && item.diet !== 'beverage') return false;
          if (selectedDiet === 'sweet' && item.diet !== 'sweet') return false;
        }
        return true;
      });

      const cfg = MEALS_CONFIG.find(m => m.id === mealName) || MEALS_CONFIG[0];

      return (
        <div className="bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex flex-col h-full hover:border-slate-700 transition duration-200">
          {/* Card Header */}
          <div className="p-5 bg-gradient-to-r from-slate-900 via-slate-800/80 to-slate-900 border-b border-slate-800 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl shadow-inner">
                {cfg.icon}
              </div>
              <div>
                <h3 className="text-lg font-bold text-white tracking-tight flex items-center gap-2">
                  {mealName}
                  <span className={`text-xs px-2.5 py-0.5 rounded-full border font-medium ${cfg.tagBg}`}>
                    {filteredItems.length} items
                  </span>
                </h3>
                <p className="text-xs text-slate-400 font-mono mt-0.5">
                  Service: {cfg.time}
                </p>
              </div>
            </div>
          </div>

          {/* Items List */}
          <div className="p-4 sm:p-5 flex-1 divide-y divide-slate-800/60">
            {filteredItems.length === 0 ? (
              <div className="py-12 text-center">
                <span className="text-3xl block mb-2">🔍</span>
                <p className="text-slate-400 text-sm font-medium">No dishes match the selected filters.</p>
                <p className="text-slate-600 text-xs mt-1">Try selecting "All Items" or clearing your search.</p>
              </div>
            ) : (
              filteredItems.map((item, index) => {
                const hasAlternates = item.text.includes('/') && !item.text.includes('(karam is made');
                const parts = hasAlternates ? item.text.split('/') : [item.text];

                return (
                  <div
                    key={index}
                    className="py-3.5 first:pt-1 last:pb-1 group hover:bg-slate-800/40 px-3 rounded-xl transition"
                  >
                    <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-2.5">
                      <div className="flex-1 pr-2">
                        {hasAlternates && parts.length > 1 ? (
                          <div>
                            <span className="text-[11px] uppercase tracking-wider font-semibold text-amber-400 block mb-1">
                              Alternative Choices:
                            </span>
                            <div className="space-y-1">
                              {parts.map((p, pIdx) => (
                                <div key={pIdx} className="flex items-center gap-2 text-sm text-slate-200">
                                  <span className="text-xs text-orange-400 font-bold">✦</span>
                                  <span>{p.trim()}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <p className="text-sm font-medium text-slate-200 group-hover:text-white transition leading-relaxed">
                            {item.text}
                          </p>
                        )}
                      </div>

                      <div className="flex items-center gap-1.5 flex-shrink-0 self-start sm:self-center mt-1 sm:mt-0">
                        <RotationBadge rotation={item.rotation} />
                        <DietBadge diet={item.diet} />
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* Footer Card Info */}
          <div className="px-5 py-3 bg-slate-950/40 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
            <span className="flex items-center gap-1.5">
              <span>🌾</span> 100% Quality Atta & Sona Masuri Rice
            </span>
            <span className="text-slate-400 font-medium">Unlimited Refills</span>
          </div>
        </div>
      );
    }

    // Main App
    function App() {
      const todayIndex = new Date().getDay();
      const todayName = DAYS_ORDER[todayIndex];

      const [menuData, setMenuData] = useState(window.DEFAULT_MENU_DATA || { menus: {}, instructions: [] });
      const [selectedSheet, setSelectedSheet] = useState('Veg_Non-Veg');
      const [selectedDay, setSelectedDay] = useState(todayName);
      const [activeMeal, setActiveMeal] = useState('Breakfast');
      const [viewMode, setViewMode] = useState('single');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDiet, setSelectedDiet] = useState('all');
      const [selectedRotation, setSelectedRotation] = useState('all');

      // Live Time & Meal Tracker
      const [timeStr, setTimeStr] = useState('');
      const [activeLiveMeal, setActiveLiveMeal] = useState('');

      // Modals
      const [isInstructionsOpen, setIsInstructionsOpen] = useState(false);
      const [isUploadOpen, setIsUploadOpen] = useState(false);
      const [isWeeklyOpen, setIsWeeklyOpen] = useState(false);

      useEffect(() => {
        const tick = () => {
          const now = new Date();
          setTimeStr(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          const currentMin = now.getHours() * 60 + now.getMinutes();

          if (currentMin >= 420 && currentMin < 600) setActiveLiveMeal('Serving: Breakfast');
          else if (currentMin >= 600 && currentMin < 720) setActiveLiveMeal('Next: Lunch (12:00 PM)');
          else if (currentMin >= 720 && currentMin < 900) setActiveLiveMeal('Serving: Lunch');
          else if (currentMin >= 900 && currentMin < 990) setActiveLiveMeal('Next: Snacks (4:30 PM)');
          else if (currentMin >= 990 && currentMin < 1110) setActiveLiveMeal('Serving: Snacks');
          else if (currentMin >= 1110 && currentMin < 1170) setActiveLiveMeal('Next: Dinner (7:30 PM)');
          else if (currentMin >= 1170 && currentMin < 1320) setActiveLiveMeal('Serving: Dinner');
          else setActiveLiveMeal('Next: Breakfast (7:00 AM)');
        };
        tick();
        const iv = setInterval(tick, 1000);
        return () => clearInterval(iv);
      }, []);

      const sheetOptions = useMemo(() => {
        return Object.keys(menuData?.menus || {});
      }, [menuData]);

      const currentSheet = useMemo(() => {
        if (!menuData?.menus) return null;
        return menuData.menus[selectedSheet] || Object.values(menuData.menus)[0];
      }, [menuData, selectedSheet]);

      const getGroupForDay = (dayName) => {
        if (!currentSheet?.dayGroups) return null;
        return currentSheet.dayGroups.find(g =>
          g.days.some(d => d.toLowerCase() === dayName.toLowerCase())
        );
      };

      const activeGroup = useMemo(() => {
        return getGroupForDay(selectedDay) || (currentSheet?.dayGroups ? currentSheet.dayGroups[0] : null);
      }, [currentSheet, selectedDay]);

      // Excel upload handler
      const handleFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const buffer = await file.arrayBuffer();
          if (!window.XLSX) throw new Error('SheetJS XLSX library not ready');
          
          const wb = window.XLSX.read(buffer, { type: 'array' });
          const parsed = {
            metadata: { sourceFile: file.name, sheets: wb.SheetNames },
            menus: {},
            instructions: []
          };

          wb.SheetNames.forEach(name => {
            const sheet = wb.Sheets[name];
            const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!rows.length) return;

            const title = (rows[1] && rows[1][0]) ? String(rows[1][0]).trim() : name;
            const dayGroups = [];

            for (let r = 3; r < rows.length; r++) {
              const row = rows[r];
              if (!row) continue;
              const firstCell = String(row[0] || '').trim();
              if (firstCell.toLowerCase().includes('instruction')) break;
              if (!firstCell) continue;

              const matchedDays = WEEKDAYS.map(w => w.full).filter(d =>
                firstCell.toLowerCase().includes(d.toLowerCase())
              );

              if (matchedDays.length > 0) {
                const parseCell = (txt) => {
                  if (!txt) return { raw: '', items: [] };
                  const lines = String(txt).split('\n').map(l => l.trim()).filter(Boolean);
                  const items = lines.map(line => {
                    const lower = line.toLowerCase();
                    let diet = 'veg';
                    if (/(chicken|mutton|fish)/.test(lower)) diet = 'non-veg';
                    else if (/(egg|omlet|omelet|bhurji)/.test(lower)) diet = 'egg';
                    else if (/(tea|coffee|milk|juice|lassi|malt|lemon water|buttermilk)/.test(lower)) diet = 'beverage';
                    else if (/(laddu|jilebi|halwa|payasam|gulab jamun|mysore pak|ice cream|sweet)/.test(lower)) diet = 'sweet';
                    else if (lower.includes('soup')) diet = 'soup';

                    let rotation = 'all';
                    if (lower.includes('week1,week3') || lower.includes('week 1,week 3')) rotation = 'week1_3';
                    else if (lower.includes('week2,week4') || lower.includes('week 2,week 4')) rotation = 'week2_4';
                    else if (lower.includes('alt week') || lower.includes('alternative week')) rotation = 'alt_weeks';

                    return { text: line, diet, rotation };
                  });
                  return { raw: txt, items };
                };

                dayGroups.push({
                  id: 'group-' + r,
                  groupName: firstCell,
                  days: matchedDays,
                  meals: {
                    Breakfast: parseCell(row[1]),
                    Lunch: parseCell(row[2]),
                    Snacks: parseCell(row[3]),
                    Dinner: parseCell(row[4])
                  }
                });
              }
            }

            for (let r = 7; r < rows.length; r++) {
              const row = rows[r];
              if (!row) continue;
              for (let c = 0; c < row.length; c++) {
                const cellVal = String(row[c] || '').trim();
                if (cellVal.startsWith('1.') && cellVal.includes('Thick curd')) {
                  const lines = cellVal.replace(/\ufffd/g, '-').split('\n').map(l => l.trim()).filter(Boolean);
                  if (lines.length > 0 && !parsed.instructions.length) {
                    parsed.instructions = lines;
                  }
                }
              }
            }

            parsed.menus[name] = { sheetName: name, title, dayGroups };
          });

          setMenuData(parsed);
          setSelectedSheet(Object.keys(parsed.menus)[0]);
          setIsUploadOpen(false);
        } catch (err) {
          alert('Error parsing uploaded file: ' + err.message);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-orange-500 selection:text-slate-950">
          {/* Ambient Lighting Glows */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div className="absolute -top-32 left-1/4 w-96 h-96 bg-orange-500/10 rounded-full blur-3xl"></div>
            <div className="absolute top-1/2 right-10 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-20 left-1/3 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
          </div>

          {/* Top Bar / Navigation */}
          <header className="sticky top-0 z-30 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 text-white shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                {/* Brand */}
                <div className="flex items-center space-x-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-500 to-rose-500 flex items-center justify-center shadow-lg shadow-orange-500/25 ring-2 ring-orange-400/30">
                    <span className="text-2xl">🍽️</span>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="text-[10px] uppercase tracking-widest font-bold px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30">
                        VIT-AP
                      </span>
                      <span className="text-xs text-slate-400 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Live Cafeteria
                      </span>
                    </div>
                    <h1 className="text-lg sm:text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400 tracking-tight">
                      Campus Mess Menu
                    </h1>
                  </div>
                </div>

                {/* Center Live Clock */}
                <div className="hidden md:flex flex-col items-center">
                  <div className="text-sm font-semibold tracking-wider font-mono text-amber-300 flex items-center gap-2">
                    <span className="text-xs text-slate-400 font-sans">Campus Time:</span> {timeStr}
                  </div>
                  <div className="mt-0.5 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950/80 text-emerald-400 border border-emerald-500/30 shadow-sm">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-ping"></span>
                    {activeLiveMeal}
                  </div>
                </div>

                {/* Right Controls */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  {/* Sheet Switcher */}
                  <div className="bg-slate-800/90 p-1 rounded-xl border border-slate-700 flex items-center text-xs font-medium">
                    {sheetOptions.map((sheet) => {
                      const isSelected = selectedSheet === sheet;
                      const isSpecial = sheet.toLowerCase().includes('special');
                      return (
                        <button
                          key={sheet}
                          onClick={() => setSelectedSheet(sheet)}
                          className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${
                            isSelected
                              ? isSpecial
                                ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md'
                                : 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md'
                              : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
                          }`}
                        >
                          <span>{isSpecial ? '✨' : '🥗'}</span>
                          <span className="hidden sm:inline">{sheet.replace('_', ' ')}</span>
                          <span className="sm:hidden">{isSpecial ? 'Special' : 'Regular'}</span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Week Matrix */}
                  <button
                    onClick={() => setIsWeeklyOpen(true)}
                    title="View Full Week Grid"
                    className="px-2.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1.5 text-xs font-semibold"
                  >
                    <span>📅</span>
                    <span className="hidden lg:inline">Week Grid</span>
                  </button>

                  {/* Instructions */}
                  <button
                    onClick={() => setIsInstructionsOpen(true)}
                    title="Official Mess Service Guidelines"
                    className="px-2.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-amber-400 hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1.5 text-xs font-semibold"
                  >
                    <span>📋</span>
                    <span className="hidden lg:inline">Rules</span>
                  </button>

                  {/* Upload */}
                  <button
                    onClick={() => setIsUploadOpen(true)}
                    title="Upload / Replace mess.xlsx"
                    className="px-3 py-2 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-bold shadow-md shadow-orange-500/20 transition flex items-center gap-1.5 text-xs"
                  >
                    <span>📤</span>
                    <span className="hidden sm:inline">Upload Excel</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 z-10">
            {/* Header Banner */}
            <div className="mb-6 bg-gradient-to-r from-slate-900/90 via-slate-900/70 to-slate-900/90 border border-slate-800/80 rounded-3xl p-6 sm:p-8 backdrop-blur-md shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 right-0 transform translate-x-8 -translate-y-8 w-44 h-44 bg-gradient-to-br from-orange-500/20 to-amber-500/0 rounded-full blur-2xl"></div>

              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 text-xs font-semibold text-amber-300 border border-slate-700 mb-3">
                    <span>📍</span>
                    <span>{currentSheet?.title || 'VIT-AP MESS MENU'}</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                    Cafeteria Dashboard
                  </h2>
                  <p className="text-sm text-slate-400 mt-1 max-w-2xl">
                    Real-time day-to-day mess menu schedule with automated rotation group matching, dish categorization, and dietary filters.
                  </p>
                </div>

                {/* Current Matched Day Group Badge */}
                {activeGroup && (
                  <div className="flex-shrink-0 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-lg flex items-center gap-4">
                    <div className="w-12 h-12 rounded-xl bg-orange-500/20 border border-orange-500/30 flex items-center justify-center text-2xl">
                      {selectedDay.toLowerCase() === todayName.toLowerCase() ? '🌟' : '🗓️'}
                    </div>
                    <div>
                      <div className="text-[11px] uppercase tracking-wider text-slate-400 font-bold">
                        {selectedDay.toLowerCase() === todayName.toLowerCase() ? "Today's Matched Group" : "Selected Group"}
                      </div>
                      <div className="text-base font-extrabold text-white">
                        {activeGroup.groupName}
                      </div>
                      <div className="text-xs text-amber-400 font-medium mt-0.5">
                        Covers: {activeGroup.days.join(', ')}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Day Selector (Mon-Sun with TODAY pill) */}
            <div className="w-full bg-slate-900/60 backdrop-blur-md rounded-2xl p-4 border border-slate-800 shadow-xl mb-6">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3 px-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Day Schedule
                  </span>
                  <span className="text-slate-600">•</span>
                  <span className="text-xs text-amber-400 font-medium flex items-center gap-1">
                    <span>✨</span> Active: <strong className="text-white">{selectedDay}</strong>
                    {activeGroup && (
                      <span className="text-slate-400 font-normal">
                        ({activeGroup.groupName})
                      </span>
                    )}
                  </span>
                </div>

                {selectedDay.toLowerCase() !== todayName.toLowerCase() && (
                  <button
                    onClick={() => setSelectedDay(todayName)}
                    className="text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-500/20 text-orange-400 hover:bg-orange-500/30 border border-orange-500/40 transition flex items-center gap-1.5"
                  >
                    <span>🎯</span> Jump to Today ({todayName})
                  </button>
                )}
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                {WEEKDAYS.map(({ full, short }) => {
                  const isSelected = selectedDay.toLowerCase() === full.toLowerCase();
                  const isDayToday = todayName.toLowerCase() === full.toLowerCase();
                  const group = getGroupForDay(full);

                  return (
                    <button
                      key={full}
                      onClick={() => setSelectedDay(full)}
                      className={`relative flex flex-col items-center justify-center p-3 rounded-xl transition-all duration-200 border text-left ${
                        isSelected
                          ? 'bg-gradient-to-b from-orange-500/20 via-slate-800 to-slate-900 border-orange-500 text-white shadow-lg shadow-orange-500/10 scale-[1.02] ring-1 ring-orange-500/50'
                          : 'bg-slate-800/60 border-slate-800/80 text-slate-300 hover:bg-slate-800 hover:border-slate-700 hover:text-white'
                      }`}
                    >
                      {isDayToday && (
                        <span className="absolute -top-2 right-2 px-1.5 py-0.2 rounded-full text-[9px] font-black uppercase tracking-wider bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md ring-1 ring-orange-400 animate-pulse">
                          Today
                        </span>
                      )}

                      <span className="text-xs font-semibold text-slate-400">
                        {short}
                      </span>
                      <span className="text-sm font-bold tracking-tight">
                        {full}
                      </span>

                      <span className="text-[10px] mt-1 text-slate-400 truncate max-w-full px-1 text-center font-medium">
                        {group ? (
                          group.days.length > 1 ? (
                            <span className="text-slate-500">{group.days.map(d => d.slice(0, 3)).join('/')}</span>
                          ) : (
                            <span className="text-slate-500">Solo Menu</span>
                          )
                        ) : 'Menu'}
                      </span>

                      {isSelected && (
                        <div className="w-8 h-1 bg-gradient-to-r from-amber-400 to-orange-500 rounded-full mt-2"></div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Search & Filters */}
            <div className="mb-6 bg-slate-900/60 rounded-2xl p-4 border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg backdrop-blur-md">
              <div className="relative w-full md:w-80">
                <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                  🔍
                </span>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search dishes (e.g., Biryani, Dosa, Paneer)..."
                  className="w-full pl-10 pr-4 py-2 bg-slate-800/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 transition"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                )}
              </div>

              <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div className="flex items-center gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700 text-xs">
                  {[
                    { id: 'all', label: 'All' },
                    { id: 'veg', label: '🥗 Veg' },
                    { id: 'non-veg', label: '🍗 Non-Veg' },
                    { id: 'egg', label: '🥚 Egg' },
                    { id: 'beverage', label: '☕ Drinks' }
                  ].map((diet) => (
                    <button
                      key={diet.id}
                      onClick={() => setSelectedDiet(diet.id)}
                      className={`px-2.5 py-1 rounded-lg font-medium transition ${
                        selectedDiet === diet.id
                          ? 'bg-orange-500 text-slate-950 font-bold shadow'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {diet.label}
                    </button>
                  ))}
                </div>

                <select
                  value={selectedRotation}
                  onChange={(e) => setSelectedRotation(e.target.value)}
                  className="bg-slate-800/80 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-orange-500"
                >
                  <option value="all">All Rotations</option>
                  <option value="week1_3">Week 1 & 3 Only</option>
                  <option value="week2_4">Week 2 & 4 Only</option>
                  <option value="alt_weeks">Alt Weeks Only</option>
                </select>
              </div>
            </div>

            {/* Meal Toggle / Tabs (Breakfast & Lunch Separated cleanly) */}
            <div className="w-full mb-6">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-4">
                <div className="w-full sm:w-auto p-1.5 bg-slate-900/90 rounded-2xl border border-slate-800 backdrop-blur-md shadow-lg flex flex-wrap gap-1.5">
                  {MEALS_CONFIG.map((meal) => {
                    const isActive = activeMeal === meal.id && viewMode !== 'compare';
                    return (
                      <button
                        key={meal.id}
                        onClick={() => {
                          setActiveMeal(meal.id);
                          setViewMode('single');
                        }}
                        className={`flex-1 sm:flex-initial px-4 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2.5 ${
                          isActive
                            ? `bg-gradient-to-r ${meal.color} text-slate-950 shadow-lg scale-[1.02] ${meal.activeGlow}`
                            : 'text-slate-400 hover:text-white hover:bg-slate-800/80'
                        }`}
                      >
                        <span className="text-base">{meal.icon}</span>
                        <span className="tracking-tight">{meal.label}</span>
                        <span className={`text-[10px] hidden md:inline px-1.5 py-0.5 rounded-full font-mono font-medium ${
                          isActive ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'
                        }`}>
                          {meal.time.split('–')[0].trim()}
                        </span>
                      </button>
                    );
                  })}
                </div>

                {/* View Mode Toggle (Single vs Compare Breakfast & Lunch) */}
                <div className="flex items-center gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                  <button
                    onClick={() => setViewMode('single')}
                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${
                      viewMode === 'single'
                        ? 'bg-orange-500 text-slate-950 shadow font-bold'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span>📄</span> Single Meal
                  </button>
                  <button
                    onClick={() => setViewMode('compare')}
                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${
                      viewMode === 'compare'
                        ? 'bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 shadow font-bold'
                        : 'text-slate-400 hover:text-white'
                    }`}
                    title="View Breakfast & Lunch side-by-side"
                  >
                    <span>⚡</span> Breakfast vs Lunch
                  </button>
                </div>
              </div>
            </div>

            {/* Menu Cards Display */}
            {activeGroup ? (
              <div>
                {viewMode === 'compare' ? (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fadeIn">
                    <MenuCard
                      mealName="Breakfast"
                      mealData={activeGroup.meals.Breakfast}
                      searchQuery={searchQuery}
                      selectedRotation={selectedRotation}
                      selectedDiet={selectedDiet}
                    />
                    <MenuCard
                      mealName="Lunch"
                      mealData={activeGroup.meals.Lunch}
                      searchQuery={searchQuery}
                      selectedRotation={selectedRotation}
                      selectedDiet={selectedDiet}
                    />
                  </div>
                ) : (
                  <div className="max-w-4xl mx-auto animate-fadeIn">
                    <MenuCard
                      mealName={activeMeal}
                      mealData={activeGroup.meals[activeMeal]}
                      searchQuery={searchQuery}
                      selectedRotation={selectedRotation}
                      selectedDiet={selectedDiet}
                    />
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-slate-900/60 rounded-2xl p-12 border border-slate-800 text-center text-slate-400">
                No schedule found for the selected day.
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-900/40 py-6 mt-12 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span>🍛</span>
                <span className="font-semibold text-slate-400">
                  VIT-AP University Digital Cafeteria
                </span>
              </div>
              <div className="flex items-center gap-4">
                <button
                  onClick={() => setIsInstructionsOpen(true)}
                  className="text-amber-400 hover:underline"
                >
                  Mess Service Instructions (13 Rules)
                </button>
                <span className="text-slate-700">•</span>
                <button
                  onClick={() => setIsWeeklyOpen(true)}
                  className="text-indigo-400 hover:underline"
                >
                  Full Weekly Schedule
                </button>
              </div>
            </div>
          </footer>

          {/* Instructions Modal */}
          {isInstructionsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-gradient-to-r from-amber-500/10 via-slate-900 to-orange-500/10">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl border border-amber-500/30">
                      📋
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white tracking-tight">
                        MESS SERVICE INSTRUCTIONS
                      </h2>
                      <p className="text-xs text-slate-400">
                        Official caterer guidelines, portion sizes, and service standards
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsInstructionsOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 overflow-y-auto flex-1 space-y-3.5 divide-y divide-slate-800">
                  {(menuData.instructions || []).map((item, idx) => (
                    <div key={idx} className="pt-3 first:pt-0 flex items-start gap-3">
                      <span className="flex-shrink-0 w-6 h-6 rounded-full bg-slate-800 text-amber-400 text-xs font-mono font-bold flex items-center justify-center border border-slate-700">
                        {idx + 1}
                      </span>
                      <div className="text-sm text-slate-300 leading-relaxed">
                        {item.replace(/^\d+\.\s*/, '')}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between">
                  <span className="text-xs text-slate-500">
                    VIT-AP Mess Quality Standards
                  </span>
                  <button
                    onClick={() => setIsInstructionsOpen(false)}
                    className="px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-slate-950 font-bold text-xs transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Upload Modal */}
          {isUploadOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-800/40">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-orange-500/20 text-orange-400 flex items-center justify-center text-xl border border-orange-500/30">
                      📊
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white tracking-tight">
                        Update Mess Menu Spreadsheet
                      </h2>
                      <p className="text-xs text-slate-400">
                        Upload your updated mess.xlsx file to parse dynamically
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsUploadOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6">
                  <label className="border-2 border-dashed border-slate-700 hover:border-slate-500 bg-slate-800/40 rounded-2xl p-8 text-center cursor-pointer block transition">
                    <input
                      type="file"
                      accept=".xlsx,.xls"
                      className="hidden"
                      onChange={handleFileUpload}
                    />
                    <div className="text-4xl mb-3">📁</div>
                    <p className="text-sm font-semibold text-slate-200 mb-1">
                      Click or drop your <span className="text-orange-400">mess.xlsx</span> file here
                    </p>
                    <p className="text-xs text-slate-500">
                      Parses sheet structure, day groups, and items automatically
                    </p>
                  </label>
                </div>

                <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between">
                  <button
                    onClick={() => {
                      setMenuData(window.DEFAULT_MENU_DATA);
                      setSelectedSheet('Veg_Non-Veg');
                      setIsUploadOpen(false);
                    }}
                    className="text-xs text-slate-400 hover:text-amber-400 font-medium transition flex items-center gap-1"
                  >
                    <span>🔄</span> Reset to Default
                  </button>
                  <a
                    href="./mess.xlsx"
                    download="mess.xlsx"
                    className="text-xs text-slate-400 hover:text-white font-medium transition flex items-center gap-1"
                  >
                    <span>⬇️</span> Download Current Excel
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* Weekly Schedule Overview Modal */}
          {isWeeklyOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-800/40">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl border border-indigo-500/30">
                      📅
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white tracking-tight">
                        Full Weekly Schedule Overview
                      </h2>
                      <p className="text-xs text-slate-400">
                        Complete meal rotation grid for {selectedSheet.replace('_', ' ')}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsWeeklyOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 overflow-auto flex-1">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300 border-collapse">
                      <thead>
                        <tr className="border-b border-slate-700 bg-slate-800/60 text-slate-400 font-semibold uppercase tracking-wider">
                          <th className="p-3 w-40">Day Group</th>
                          <th className="p-3">🥞 Breakfast</th>
                          <th className="p-3">🍛 Lunch</th>
                          <th className="p-3">☕ Snacks</th>
                          <th className="p-3">🍲 Dinner</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/80">
                        {(currentSheet?.dayGroups || []).map((group) => (
                          <tr key={group.id} className="hover:bg-slate-800/30 transition">
                            <td className="p-3 font-bold text-amber-400 align-top bg-slate-900/40">
                              <div>{group.groupName}</div>
                              <div className="text-[10px] text-slate-500 font-normal mt-1">
                                {group.days.join(', ')}
                              </div>
                            </td>
                            <td className="p-3 align-top whitespace-pre-line text-slate-200 leading-relaxed max-w-xs">
                              {group.meals.Breakfast.raw || '—'}
                            </td>
                            <td className="p-3 align-top whitespace-pre-line text-slate-200 leading-relaxed max-w-xs">
                              {group.meals.Lunch.raw || '—'}
                            </td>
                            <td className="p-3 align-top whitespace-pre-line text-slate-200 leading-relaxed max-w-xs">
                              {group.meals.Snacks.raw || '—'}
                            </td>
                            <td className="p-3 align-top whitespace-pre-line text-slate-200 leading-relaxed max-w-xs">
                              {group.meals.Dinner.raw || '—'}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-end">
                  <button
                    onClick={() => setIsWeeklyOpen(false)}
                    className="px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-slate-950 font-bold text-xs transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
